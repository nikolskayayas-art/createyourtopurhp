<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>create your top</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://files.catbox.moe">
</head>
<body>
  <!-- Навигация -->
  <nav>
    <a href="index.html" class="active">Top</a>
    <a href="participants.html">Participants</a>
    <a href="streaming.html">Streaming Guide</a>
<a href="episodes.html" class="nav-button">Episodes</a>
  </nav>

  <!-- Шапка -->
  <img src="https://files.catbox.moe/5u6yjr.jpeg" class="header-img" crossorigin="anonymous" loading="eager" onerror="this.style.backgroundColor='#4a5cd8'; this.style.minHeight='180px';">

  <!-- Основной контейнер -->
  <div class="container">
    <h1>CREATE YOUR TOP</h1>
    <div class="subtitle">make your own hip pop princess lineup</div>

    <!-- Выбор размера топа -->
    <div class="format-selector">
      <input id="topSize" type="number" min="1" max="40" value="8" class="format-input">
      <button class="format-btn" onclick="applyTopSize()">set top</button>
      <div class="format-hint">(1–40)</div>
    </div>

    <!-- Пирамида -->
    <div class="pyramid-container" id="pyramid"></div>

    <!-- Поиск -->
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search by name..." oninput="filterContestants()">
    </div>

    <!-- Список участниц -->
    <div class="contestants-list">
      <div class="contestants-grid" id="contestantsGrid"></div>
    </div>


    <!-- Водяной знак -->
    <a href="https://t.me/hippopprincessy" class="watermark">author credit</a>
  </div>

  <!-- Скрипты -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
